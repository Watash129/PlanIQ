<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIQ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

    <header class="site-header">
        <!-- Logo -->
        <a href="#account" class="header-logo">PLANIQ</a>

        <!-- Navigation links -->
        <nav class="header-nav">
            <a href="#">notes</a>
            <a href="#">calendar</a>
            <a href="#">PlanAI</a>
            <a href="#">Folder</a>
        </nav>

        <!-- Search bar -->
        <form class="header-search" role="search">
            <input type="search" id="site-search" placeholder="🔍 Search..." />
        </form>

        <!-- Header actions -->
        <div class="header-actions">
            <!-- Dark / Light mode switch -->
            <div class="theme-switch">
                <input type="checkbox" id="theme-switch" class="theme-switch__input" role="switch" aria-checked="true" aria-label="Toggle dark mode">
                <div class="theme-switch__track" aria-hidden="true">
                    <span class="theme-switch__thumb"></span>
                    <span class="theme-switch__icon theme-switch__icon--moon">🌙</span>
                    <span class="theme-switch__icon theme-switch__icon--sun">☀️</span>
                </div>
            </div>

            <!-- Settings gear icon -->
            <button type="button" id="settings-button" class="settings-button" aria-label="Open settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c-.698-1.283.705-2.686 1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
                </svg>
            </button>

            <!-- Account details button with circular profile picture -->
            <button type="button" id="account-button" class="account-button" aria-label="Open account details">
                <span class="profile-avatar" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z" />
                    </svg>
                </span>
            </button>
        </div>
    </header>

    <!-- Settings panel -->
    <div class="settings-panel" id="settings" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="settings-panel__content">
            <h2>Settings</h2>
        </div>
    </div>

    <!-- Account panel -->
    <div class="account-panel" id="account" role="dialog" aria-modal="true" aria-label="Account details">
        <div class="account-panel__content">
            <h2>Account</h2>
        </div>
    </div>

    <section class="main">

    </section>

    <script src="app.js"></script>
</body>
</html>
